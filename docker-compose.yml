services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: kata-api:local
    ports:
      - "${API_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      ALLOWED_DOMAINS: "${ALLOWED_DOMAINS}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      ATTACHMENTS_DIR: "/data/attachments"
      MAX_ATTACHMENT_BYTES: "${MAX_ATTACHMENT_BYTES:-26214400}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      SENTRY_DSN: "${SENTRY_DSN}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_REGION: "${S3_REGION:-auto}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
    volumes:
      - attachments:/data/attachments
    restart: unless-stopped

  relay:
    build:
      context: .
      dockerfile: apps/kata-relay-service/Dockerfile
    image: kata-relay-service:local
    ports:
      - "${RELAY_PORT:-8788}:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      ALLOWED_DOMAINS: "${ALLOWED_DOMAINS}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      SENTRY_DSN: "${SENTRY_DSN}"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kata-web:local
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "${PORT:-3000}"
      PUBLIC_API_URL: "${PUBLIC_API_URL}"
      PUBLIC_REALTIME_URL: "${PUBLIC_REALTIME_URL}"
      API_URL: "${API_URL}"
      SENTRY_DSN: "${SENTRY_DSN}"
    restart: unless-stopped
    depends_on:
      - api
      - relay

volumes:
  attachments:
