# Production-like run of the single app image against an EXISTING Postgres.
# Required variables come from your shell or a .env file (see apps/web/.env.example).
#
#   docker compose run --rm migrate    # apply migrations (node migrate.js)
#   docker compose up --build web
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  migrate:
    build: *app-build
    image: kata-web:local
    command: ["node", "migrate.js"]
    environment:
      DATABASE_URL: "${DATABASE_URL}"
    profiles: ["migrate"]
    restart: "no"

  web:
    build: *app-build
    image: kata-web:local
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      ORIGIN: "${ORIGIN}"
      DATABASE_URL: "${DATABASE_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      ALLOWED_DOMAINS: "${ALLOWED_DOMAINS}"
      MAX_ATTACHMENT_BYTES: "${MAX_ATTACHMENT_BYTES:-26214400}"
      PUBLIC_SENTRY_DSN: "${PUBLIC_SENTRY_DSN:-}"
      # Local-disk attachments by default; set GCS_BUCKET (plus Google credentials)
      # to use Cloud Storage instead.
      ATTACHMENTS_DIR: "/data/attachments"
      GCS_BUCKET: "${GCS_BUCKET:-}"
    volumes:
      - attachments:/data/attachments
    restart: unless-stopped

volumes:
  attachments:
