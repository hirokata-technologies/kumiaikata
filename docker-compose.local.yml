# Local preview of the production layout: ONE app container (SvelteKit + the Hono API
# at /api, served on a single origin) plus Postgres. No Redis, no separate API/relay.
#
# Migrations are not run by the app on startup. The `migrate` service runs the same
# image's `node migrate.js` (the command a Cloud Run Job uses) and must finish before
# `web` starts.
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kata
      POSTGRES_PASSWORD: kata
      POSTGRES_DB: kata
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kata"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  migrate:
    build: *app-build
    image: kata-web:local
    command: ["node", "migrate.js"]
    environment:
      DATABASE_URL: "postgresql://kata:kata@postgres:5432/kata"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build: *app-build
    image: kata-web:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # adapter-node: the public origin of the app (must match what the browser uses).
      ORIGIN: "http://localhost:3000"
      DATABASE_URL: "postgresql://kata:kata@postgres:5432/kata"
      BETTER_AUTH_SECRET: "3mV4fO4rKUXBtOhDVV3FJNhJTtbxZhWBbN52Ci6J6IU="
      # Same origin as ORIGIN: Better Auth is served by the app at /api/auth.
      # The Google OAuth redirect URI to register is <BETTER_AUTH_URL>/api/auth/callback/google
      BETTER_AUTH_URL: "http://localhost:3000"
      GOOGLE_CLIENT_ID: "581143433345-ppc8men3sjfjb86brrsckvv4pg8oqbh8.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "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"
      ALLOWED_DOMAINS: "hirokata.dev,localhost"
      ATTACHMENTS_DIR: "/data/attachments"
      MAX_ATTACHMENT_BYTES: "26214400"
      RESEND_API_KEY: "re_CXbqGVMT_861svXUDyyeMwQp4YyAMFS5o"
      PUBLIC_SENTRY_DSN: "https://4d22ac8e8d57ce38762b5d9a6bd83b6a@o4511008752336896.ingest.us.sentry.io/4511472254124032"
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=3 -qO- http://localhost:3000/healthz | grep -q 'ok' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  # WARNING: PostgreSQL 18 cannot read a PG15 data directory.
  # Before upgrading from postgres:15-alpine, remove the existing volume:
  #   docker volume rm $(docker compose ls -q)_postgres_data
  postgres_data:
  attachments:
