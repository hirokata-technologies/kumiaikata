services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kata
      POSTGRES_PASSWORD: kata
      POSTGRES_DB: kata
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kata"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: kata-api:local
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: "postgresql://kata:kata@postgres:5432/kata"
      BETTER_AUTH_SECRET: "3mV4fO4rKUXBtOhDVV3FJNhJTtbxZhWBbN52Ci6J6IU="
      BETTER_AUTH_URL: "http://localhost:8787"
      GOOGLE_CLIENT_ID: "581143433345-ppc8men3sjfjb86brrsckvv4pg8oqbh8.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "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"
      ALLOWED_DOMAINS: "hirokata.dev,edamame.ph,localhost"
      ALLOWED_ORIGINS: "http://localhost:3000"
      ATTACHMENTS_DIR: "/data/attachments"
      MAX_ATTACHMENT_BYTES: "26214400"
      S3_ACCESS_KEY_ID: "tid_GEvsFueCRvfnAe_xfmJjjsJQzVsXpZEiwXMlICcsIYW_AJDQmn"
      S3_BUCKET: "balanced-tupperware-fn2lnt"
      S3_ENDPOINT: "https://t3.storageapi.dev"
      S3_REGION: "auto"
      S3_SECRET_ACCESS_KEY: "tsec_7rUSb9cP-VnKrMIIvH4iC7eoVK4OI6cTvVvhYDxNmpexc1KfehW-3SVuaaT+HFeQhxeykM"
      RESEND_API_KEY: "re_CXbqGVMT_861svXUDyyeMwQp4YyAMFS5o"
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --timeout=3 -qO- http://localhost:8787/healthz | grep -q 'ok' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: "http://localhost:8787"
    image: kata-web:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_API_URL: "http://localhost:8787"
      API_URL: "http://api:8787"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  # WARNING: PostgreSQL 18 cannot read a PG15 data directory.
  # Before upgrading from postgres:15-alpine, remove the existing volume:
  #   docker volume rm $(docker compose ls -q)_postgres_data
  #   (default project name matches the directory name, e.g. kata_postgres_data)
  postgres_data:
  attachments:
