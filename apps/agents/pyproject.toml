[project]
name = "kata-agents"
version = "0.1.0"
description = "Kata AI Project Manager and AI Strategist, built with Google ADK 2.0."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.10,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]
# Only needed to run `adk deploy agent_engine`; never shipped to Agent Runtime.
deploy = [
    "google-cloud-aiplatform[agent-engines]>=2.3,<3",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["kata_agents"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
