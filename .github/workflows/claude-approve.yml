name: Claude Approve

# The Claude GitHub App's Code Review reviews every pull request (claude.ai > Admin settings >
# Claude Code > Code review) and posts a check run named "Claude Code Review". It never approves
# or blocks a pull request, so this workflow does the approving, with plain shell and no secret
# and no model: it reads that check run and approves only when ALL of these hold:
#   - the review finished and found no Important finding (or kept an earlier clean result),
#   - the author is listed in the repository variable CLAUDE_AUTO_APPROVE_AUTHORS
#     (comma-separated GitHub logins; empty or unset means never approve) and is a repo member,
#   - the change touches nothing in PROTECTED_PATHS,
#   - the `Tests` workflow passed on the same commit,
#   - the pull request is open, not a draft, and from this repository (not a fork).
# It runs when the review finishes and again when Tests finishes, and re-checks everything each
# time, so whichever finishes last triggers the approval. It never checks out or runs pull
# request code. See README, "Claude pull request review".

on:
  check_run:
    types: [completed]
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions: {}

concurrency:
  group: claude-approve-${{ github.event.check_run.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    name: Approve
    if: >-
      (github.event_name == 'check_run' && github.event.check_run.name == 'Claude Code Review') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Empty for a pull request from a fork: GitHub does not link those to the event.
      PR: ${{ github.event.check_run.pull_requests[0].number || github.event.workflow_run.pull_requests[0].number }}
      EVENT_SHA: ${{ github.event.check_run.head_sha || github.event.workflow_run.head_sha }}
      ALLOWED_AUTHORS: ${{ vars.CLAUDE_AUTO_APPROVE_AUTHORS }}
      # Changes here always need a person: workflows, infrastructure, migrations and schema,
      # authentication and the MCP surface, dependencies and the build, and Claude's own config.
      PROTECTED_PATHS: '^(\.github/|infra/|apps/api/drizzle/|packages/db/|apps/api/src/auth/|apps/api/src/mcp/|Dockerfile|\.npmrc|\.mcp\.json|\.claude/|CLAUDE\.md|REVIEW\.md|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json$|.*/package\.json$)'
    steps:
      - name: Approve when every rule holds
        run: |
          set -euo pipefail
          note() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          [ -n "$PR" ] || { note "No pull request on this event (a fork?). Nothing to do."; exit 0; }
          pr=$(gh api "repos/$REPO/pulls/$PR")
          head=$(jq -r .head.sha <<<"$pr")
          author=$(jq -r .user.login <<<"$pr")
          assoc=$(jq -r .author_association <<<"$pr")

          [ "$(jq -r .state <<<"$pr")" = open ] || { note "Pull request is not open."; exit 0; }
          [ "$(jq -r .head.repo.full_name <<<"$pr")" = "$REPO" ] || { note "Pull request is from a fork."; exit 0; }
          # An event for an older commit says nothing about the current one.
          [ "$EVENT_SHA" = "$head" ] || { note "Event is for ${EVENT_SHA:0:7}; the branch is at ${head:0:7}."; exit 0; }

          # An approval of an older commit must not stand in for this one. (Also turn on
          # "Dismiss stale pull request approvals" in the ruleset.)
          reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate)
          jq -r --arg head "$head" '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED" and .commit_id != $head) | .id' <<<"$reviews" |
            while read -r id; do
              gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
                -f message="The branch moved on; approval is re-evaluated for the new commit." >/dev/null || true
            done
          if jq -e --arg head "$head" 'any(.[]; .user.login == "github-actions[bot]" and .state == "APPROVED" and .commit_id == $head)' <<<"$reviews" >/dev/null; then
            note "Already approved ${head:0:7}."; exit 0
          fi

          reasons=()
          [ "$(jq -r .draft <<<"$pr")" = false ] || reasons+=("it is a draft")

          allowed=",$(printf '%s' "$ALLOWED_AUTHORS" | tr -d ' ' | tr 'A-Z' 'a-z'),"
          lower=$(printf '%s' "$author" | tr 'A-Z' 'a-z')
          case "$allowed" in *",$lower,"*) ;; *) reasons+=("$author is not in CLAUDE_AUTO_APPROVE_AUTHORS") ;; esac
          case "$assoc" in OWNER | MEMBER | COLLABORATOR) ;; *) reasons+=("$author is not a repository member ($assoc)") ;; esac

          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[] | .filename, (.previous_filename // empty)')
          protected=$(printf '%s\n' "$files" | grep -E "$PROTECTED_PATHS" | head -5 || true)
          [ -z "$protected" ] || reasons+=("it touches protected paths: $(echo "$protected" | tr '\n' ' ')")

          tests=$(gh run list --repo "$REPO" --workflow test.yml --event pull_request --commit "$head" \
            --limit 1 --json status,conclusion -q '.[0] // empty')
          if [ -z "$tests" ] || [ "$(jq -r .status <<<"$tests")" != completed ]; then
            reasons+=("Tests has not finished on ${head:0:7}")
          elif [ "$(jq -r .conclusion <<<"$tests")" != success ]; then
            reasons+=("Tests finished with $(jq -r .conclusion <<<"$tests")")
          fi

          # The review: a finished "Claude Code Review" check run on this exact commit.
          check=$(gh api "repos/$REPO/commits/$head/check-runs" -q '[.check_runs[] | select(.name == "Claude Code Review")] | .[0] // empty')
          if [ -z "$check" ] || [ "$(jq -r .status <<<"$check")" != completed ]; then
            reasons+=("the Claude Code Review has not finished on ${head:0:7}")
          else
            title=$(jq -r '.output.title // ""' <<<"$check")
            conclusion=$(jq -r .conclusion <<<"$check")
            case "$conclusion" in
              neutral | success | skipped) ;;
              *) reasons+=("the Claude Code Review ended as $conclusion") ;;
            esac
            case "$title" in
              "Code review not repeated"*) reasons+=("earlier Important findings are still open") ;;
              "Code review found no issues"*) ;; # a clean review
              *"no new changes") ;; # an earlier review with no open Important finding was kept
              *)
                # The last line of the details is an HTML comment with the severity counts.
                text=$(gh api "repos/$REPO/check-runs/$(jq -r .id <<<"$check")" -q '.output.text // ""')
                counts=$(printf '%s\n' "$text" | tail -n 1 | sed -n 's/^<!-- bughunter-severity: \(.*\) -->$/\1/p')
                if [ -z "$counts" ]; then
                  reasons+=("the review left no verdict")
                elif [ "$(jq -r '.normal // "?"' <<<"$counts")" != 0 ]; then
                  reasons+=("the review found $(jq -r .normal <<<"$counts") Important finding(s)")
                fi
                ;;
            esac
          fi

          if [ ${#reasons[@]} -gt 0 ]; then
            note "Not approving ${head:0:7}:"; printf ' - %s\n' "${reasons[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr review "$PR" --repo "$REPO" --approve \
            --body "Approved automatically: the Claude Code Review found no Important finding in ${head:0:7}, Tests passed on it, and the change stays out of the protected paths."
          note "Approved ${head:0:7}"
