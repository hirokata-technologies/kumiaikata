# Railway config plan/apply workflow.
#
# The apply job never confirms a destructive change (no `--confirm-destructive`,
# anywhere, under any condition): a plan that deletes a service, variable, volume,
# bucket or domain fails the job instead of applying. A deletion is always a
# deliberate manual `railway config apply` run by the guild master. See the
# `railway-iac-apply-policy` business doc.
#
# RAILWAY_TOKEN must be a project token scoped to hirokata.web / production. An
# agent cannot verify that scope — a human confirms it before this workflow is
# trusted (see the guild-master checklist item on the PR that adds this file).
#
# This workflow calls the pinned `@railway/cli` directly instead of the
# `railwayapp/config` action: the action hardcodes `npm ci`/`npm install`, which
# breaks on this pnpm workspace. See ADR `adr-railway-ci-cli-direct`.

name: Railway Config

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

env:
  RAILWAY_CLI_VERSION: "5.57.2"

jobs:
  safety-test:
    name: Railway IaC Safety Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Railway IaC safety test
        run: pnpm test:railway

  plan:
    name: Railway Config Plan
    needs: safety-test
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: railway-config-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Railway CLI version
        run: railway --version

      - name: Plan
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway config plan --out railway-plan.json

      - name: Validate pinned plan file
        run: |
          set -euo pipefail
          if [ ! -f railway-plan.json ]; then
            echo "::error::railway-plan.json was not produced by 'railway config plan'"
            exit 1
          fi
          if ! jq -e . railway-plan.json > /dev/null 2>&1; then
            echo "::error::railway-plan.json is not valid JSON"
            exit 1
          fi
          if ! jq -e '.changeSet.changes | type == "array"' railway-plan.json > /dev/null 2>&1; then
            echo "::error::railway-plan.json has no .changeSet.changes array"
            exit 1
          fi

      - name: Upload pinned plan
        uses: actions/upload-artifact@v4
        with:
          name: railway-plan
          path: railway-plan.json
          if-no-files-found: error
          retention-days: 30

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('railway-plan.json', 'utf8'));
            const marker = '<!-- railway-config-plan -->';

            const changes = plan?.changeSet?.changes ?? [];
            const destructive = plan?.destructive === true;
            const diff = typeof plan?.diff === 'string' ? plan.diff : '';
            const sourceTree = plan?.sourceTree ?? 'unknown';
            const configEtag = plan?.configEtag ?? 'unknown';
            const changeSetHash = plan?.changeSetHash ?? 'unknown';
            const environmentId = plan?.environmentId ?? 'unknown';
            const cliVersion = plan?.cliVersion ?? process.env.RAILWAY_CLI_VERSION ?? 'unknown';

            const lines = [marker, '## Railway config plan'];

            if (changes.length === 0) {
              lines.push('No changes — the environment already matches `.railway/`.');
            } else if (diff) {
              lines.push('```diff', diff, '```');
            } else {
              lines.push(`${changes.length} change(s) planned. See the \`railway-plan\` artifact for detail.`);
            }

            if (destructive) {
              lines.push(
                '',
                '> **Destructive change detected.** Merging this PR will **NOT** apply this plan.',
                '> The apply job refuses to confirm a destructive change. A deletion of a',
                '> service, variable, volume, bucket or domain requires a manual apply run by',
                '> the guild master after review.',
              );
            }

            lines.push(
              '',
              '| | |',
              '|---|---|',
              `| Source tree | \`${sourceTree}\` |`,
              `| Config etag | \`${configEtag}\` |`,
              `| Change-set hash | \`${changeSetHash}\` |`,
              `| Environment | \`${environmentId}\` |`,
              `| CLI version | \`${cliVersion}\` |`,
            );

            const body = lines.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Railway Config Apply
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    concurrency:
      group: railway-config-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install -g "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Download pinned plan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          artifacts_json=$(gh api "repos/${REPO}/actions/artifacts?name=railway-plan&per_page=100")

          artifact_id=$(printf '%s' "$artifacts_json" | jq -r --arg sha "$HEAD_SHA" '
            [.artifacts[] | select(.workflow_run.head_sha == $sha and .expired == false)]
            | sort_by(.created_at)
            | last
            | .id // empty
          ')

          if [ -z "$artifact_id" ]; then
            echo "::error::No non-expired 'railway-plan' artifact found for head SHA ${HEAD_SHA}. Re-plan by reopening the PR, or ask the guild master for a manual apply."
            exit 1
          fi

          gh api "repos/${REPO}/actions/artifacts/${artifact_id}/zip" > railway-plan.zip
          unzip -o railway-plan.zip railway-plan.json

      - name: Destructive pre-check (read-only)
        run: |
          set -euo pipefail

          destructive=$(jq -r 'if (.destructive | type) == "boolean" then (.destructive | tostring) else "unknown" end' railway-plan.json)

          if [ "$destructive" = "unknown" ]; then
            echo "::warning::railway-plan.json has no readable .destructive flag; relying on the CLI's own refusal to block a destructive apply."
            exit 0
          fi

          if [ "$destructive" = "true" ]; then
            {
              echo "## Destructive Railway change refused"
              echo
              echo "This plan deletes a service, variable, volume, bucket or domain."
              echo "Automation never confirms a destructive change. A manual"
              echo "\`railway config apply\` run by the guild master is required."
              echo
              echo '```diff'
            } >> "$GITHUB_STEP_SUMMARY"

            destructive_lines=$(jq -r '.diff // ""' railway-plan.json | grep -E '^-|^~ *(delete|remove|unset)' || true)
            if [ -z "$destructive_lines" ]; then
              destructive_lines=$(jq -r '.diff // ""' railway-plan.json)
            fi

            echo "::error::Pinned plan is destructive. Refusing to apply."
            printf '%s\n' "$destructive_lines"
            printf '%s\n' "$destructive_lines" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

      - name: Apply
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway config apply --plan railway-plan.json --yes
