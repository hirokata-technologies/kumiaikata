# Deploys the Kata agents (apps/agents) to Agent Runtime on Google Cloud.
#
# Infrastructure (the Agent Runtime instance, service accounts and Workload
# Identity Federation) is managed by Terraform in infra/. This workflow only
# ships new agent code to the instance Terraform created.
#
# Required repository variables (Settings → Secrets and variables → Actions →
# Variables), all taken from `terraform output` in infra/:
#   AGENT_RUNTIME_ID                 agent_runtime_id
#   GCP_DEPLOYER_SERVICE_ACCOUNT     deployer_service_account
#   GCP_WORKLOAD_IDENTITY_PROVIDER   workload_identity_provider
#
# No secrets are needed: GitHub's OIDC token is exchanged for short-lived
# Google credentials, and only runs on main may impersonate the deployer.

name: Deploy Agents

on:
  push:
    branches: [main]
    paths:
      - "apps/agents/**"
      - ".github/workflows/deploy-agents.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-agents
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Agent Runtime
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agents/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run agents tests
        run: uv run pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Deploy
        env:
          AGENT_RUNTIME_ID: ${{ vars.AGENT_RUNTIME_ID }}
        run: ./scripts/deploy.sh
