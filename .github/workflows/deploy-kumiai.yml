# Builds the kumiai app (apps/web, with the API merged in), runs database
# migrations, and deploys it to Cloud Run on Google Cloud, behind the load
# balancer at kumiai.hirokata.dev.
#
# Infrastructure (the Cloud Run service and migration job, Cloud SQL, Artifact
# Registry and the load balancer) is managed by Terraform in infra/. This
# workflow only builds a new image, migrates, and rolls it out.
#
# Required repository variables (Settings → Secrets and variables → Actions →
# Variables), taken from `terraform output` in infra/:
#   KUMIAI_IMAGE_REPOSITORY              kumiai_image_repository
#   GCP_KUMIAI_DEPLOYER_SERVICE_ACCOUNT  kumiai_deployer_service_account
#   GCP_WORKLOAD_IDENTITY_PROVIDER    workload_identity_provider
#
# No secrets are needed: GitHub's OIDC token is exchanged for short-lived
# Google credentials, and only runs on main may impersonate the deployer.

name: Deploy Kumiai

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-kumiai.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-kumiai
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  SERVICE: kumiai
  MIGRATE_JOB: kumiai-migrate

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_KUMIAI_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ vars.KUMIAI_IMAGE_REPOSITORY }}/kumiai:sha-${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=kumiai-gcp
          cache-to: type=gha,mode=max,scope=kumiai-gcp

      - uses: google-github-actions/setup-gcloud@v2

      # Migrations run before the new revision takes traffic. If they fail, the
      # job fails and the current revision keeps serving.
      - name: Run database migrations
        run: |
          gcloud run jobs update "$MIGRATE_JOB" \
            --region "$REGION" \
            --image "${{ vars.KUMIAI_IMAGE_REPOSITORY }}/kumiai:sha-${{ github.sha }}" \
            --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      - name: Deploy new revision
        run: |
          gcloud run deploy "$SERVICE" \
            --region "$REGION" \
            --image "${{ vars.KUMIAI_IMAGE_REPOSITORY }}/kumiai:sha-${{ github.sha }}" \
            --quiet
