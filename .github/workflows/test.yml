name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-web:
    name: Web Unit Tests
    runs-on: [self-hosted, Linux, X64]
    # Playwright's image ships Chromium and the system libraries it needs, so the runner host
    # needs neither sudo nor apt. Keep the tag equal to the playwright version in
    # pnpm-lock.yaml: a mismatch fails the browser tests with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:web

      - name: Type check
        run: pnpm check

      - name: Run web tests
        run: pnpm test:web

      # The server bundle includes the Hono API from source; this catches broken
      # imports between apps/web, apps/api and the workspace packages.
      - name: Build web app
        run: pnpm --filter @kata/web build

      # The container runs as root, so everything it wrote under the shared _work directory
      # (the checkout, node_modules, the tool cache) is root-owned on the host. Hand it back to
      # the runner's user, or the next job's checkout cannot clean it.
      - name: Hand the workspace back to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' /__w/_temp)" /__w

  test-api:
    name: API Tests
    runs-on: [self-hosted, Linux, X64]
    # Running in a container puts the job and its Postgres service on one Docker network, so the
    # database is reached by hostname (`postgres`) and no port is published on the runner host.
    container:
      image: node:24
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kata
          POSTGRES_PASSWORD: kata
          POSTGRES_DB: kata_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kata:kata@postgres:5432/kata_test
      BETTER_AUTH_SECRET: test-secret-value-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      RESEND_API_KEY: test-resend-api-key
      ALLOWED_DOMAINS: test.com,example.com,hirokata.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:api

      - name: Type check
        run: pnpm check:api

      - name: Run API tests
        run: pnpm test:api

      - name: Run package tests
        run: pnpm test:packages

      # The container runs as root: hand the shared _work directory back to the runner's user
      # (see the web job).
      - name: Hand the workspace back to the runner user
        if: always()
        run: chown -R "$(stat -c '%u:%g' /__w/_temp)" /__w

  test-agents:
    name: Agents Tests
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agents/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run agents tests
        run: uv run pytest

  test-infra:
    name: Terraform Checks
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
