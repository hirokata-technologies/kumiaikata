name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs a pull request needs. A push to main always runs everything.
  # A job skipped by its `if` counts as passing for required checks.
  changes:
    name: Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      agents: ${{ steps.filter.outputs.agents }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            workspace: &workspace
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
              - ".nvmrc"
              - "packages/**"
              - ".github/workflows/test.yml"
            api:
              - *workspace
              - "apps/api/**"
            web:
              - *workspace
              - "apps/web/**"
              # The web build bundles the Hono API from source.
              - "apps/api/**"
            agents:
              - "apps/agents/**"
              - ".github/workflows/test.yml"
            infra:
              - "infra/**"
              - ".github/workflows/test.yml"

  test-web:
    name: Web Unit Tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Playwright's image ships Chromium and the system libraries it needs, so the job needs
    # neither sudo nor apt. Keep the tag equal to the playwright version in
    # pnpm-lock.yaml: a mismatch fails the browser tests with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:web

      - name: Type check
        run: pnpm check

      - name: Run web tests
        run: pnpm test:web

      # The server bundle includes the Hono API from source; this catches broken
      # imports between apps/web, apps/api and the workspace packages.
      - name: Build web app
        run: pnpm --filter @kata/web build

  test-api:
    name: API Tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Running in a container puts the job and its Postgres service on one Docker network, so the
    # database is reached by hostname (`postgres`) and no port is published on the runner.
    container:
      image: node:24
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kata
          POSTGRES_PASSWORD: kata
          POSTGRES_DB: kata_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kata:kata@postgres:5432/kata_test
      BETTER_AUTH_SECRET: test-secret-value-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      RESEND_API_KEY: test-resend-api-key
      ALLOWED_DOMAINS: test.com,example.com,hirokata.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:api

      - name: Type check
        run: pnpm check:api

      - name: Run API tests
        run: pnpm test:api

      - name: Run package tests
        run: pnpm test:packages

  test-agents:
    name: Agents Tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/agents/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run agents tests
        run: uv run pytest

  test-infra:
    name: Terraform Checks
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
